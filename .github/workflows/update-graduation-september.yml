name: Update graduation status to September 2026

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-copy:
    if: ${{ !contains(github.event.head_commit.message, 'Apply September graduation copy') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update graduation wording
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('master-copy.js')]
          replacements = {
              'Jul 2019 – May 2026': 'Jul 2019 – Sep 2026',
              'Graduated: 25 May 2026': 'Graduation: September 2026',
              'Degree requirements completed; graduation recorded on 25 May 2026.': 'Degree requirements completed; formal graduation scheduled for September 2026.',
              'Degree completed; graduation recorded on 25 May 2026.': 'Degree requirements completed; formal graduation scheduled for September 2026.',
              'Degree requirements completed; graduation recorded on 25 May 2026': 'Degree requirements completed; formal graduation scheduled for September 2026.'
          }
          for path in files:
              text = path.read_text(encoding='utf-8')
              old = text
              for a, b in replacements.items():
                  text = text.replace(a, b)
              path.write_text(text, encoding='utf-8')
              print(f'Updated {path}' if text != old else f'No matching text changed in {path}')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "DaudRY"
          git config user.email "311488221+DaudRY@users.noreply.github.com"
          rm -f .github/workflows/update-graduation-september.yml
          git add index.html master-copy.js .github/workflows/update-graduation-september.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply September graduation copy"
          git push
