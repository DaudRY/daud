name: Final portfolio copy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize final portfolio copy cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final editorial cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'A snapshot of my experience and track record.': 'A snapshot of my experience and key figures.',
              'Technical experience first, supported by broader experience.': 'Hands-on technical experience, supported by broader experience.',
              'My technical experience comes first, supported by field and leadership experience that strengthened my coordination, accountability, and communication.': 'Hands-on technical experience in ERP implementation, user support, UAT, troubleshooting, and technical documentation, supported by broader field and leadership experience.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          ! grep -n 'A snapshot of my experience and track record' index.html
          ! grep -n 'Technical experience first, supported by broader experience' index.html
          ! grep -n 'My technical experience comes first, supported by field and leadership experience' index.html
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "DaudRY"
          git config user.email "311488221+github-noreply@users.noreply.github.com"
          rm -f .github/workflows/final-copy-cleanup.yml
          git add index.html .github/workflows/final-copy-cleanup.yml
          git commit -m "Finalize final portfolio copy cleanup"
          git push
