name: Sync static portfolio copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update static HTML copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'Open to opportunities across Indonesia': 'Open to entry-level IT opportunities across Indonesia',
              'A snapshot of my experience and scope.': 'A snapshot of my experience and track record.',
              'Key figures grounded in my education, hands-on ERP experience, research, and leadership roles.': 'Key figures grounded in my education, hands-on ERP experience, research, and leadership roles.',
              'Public-safe case studies based on documented experience. Sensitive client data, credentials, internal ticket IDs, transaction details, and proprietary configuration are intentionally excluded.': 'Selected case studies based on documented experience. Sensitive client data, credentials, internal ticket IDs, transaction details, and proprietary configuration are intentionally excluded.',
              'I lead with technical experience, supported by field work and leadership experience that strengthened my coordination, accountability, and communication.': 'My technical experience comes first, supported by field and leadership experience that strengthened my coordination, accountability, and communication.',
              'Why I fit IT Support &amp; ERP roles.': 'Why I fit entry-level IT Support &amp; ERP roles.',
              'My strongest value comes from combining practical technical skills, business-process understanding, user communication, and disciplined documentation.': 'I bring practical technical skills, business-process understanding, user communication, and disciplined documentation to entry-level IT roles.',
              'Open to the next technical opportunity.': 'Open to my next IT opportunity.',
              'Jul 2019 – Sep 2026': 'Jul 2019 – May 2026',
              'Degree requirements completed': 'Graduated: 25 May 2026',
              'All degree requirements completed; thesis defense passed. Formal conferral expected in September 2026.': 'Degree completed; graduation recorded on 25 May 2026.',
              'My professional experience includes remote end-user support and ERP implementation, covering system installation, user access setup, module configuration, UAT, and issue documentation.': 'My professional experience includes remote end-user support and ERP implementation, covering system installation, user access setup, module configuration, UAT, and issue tracking and documentation.',
              'I work comfortably at the intersection of user needs and technical requirements: breaking down problems, documenting gaps, escalating defects, and helping ensure solutions work for end users.': 'I work effectively at the intersection of user needs and technical requirements, breaking down problems, documenting gaps, escalating defects, and helping ensure solutions work for end users.',
              'From test checklist to same-day defect escalation': 'From UAT checklist to same-day defect escalation',
              'Thesis research using the End User Computing Satisfaction (EUCS) method with SPSS and 70 respondents to evaluate user satisfaction.': 'Thesis research using the End User Computing Satisfaction (EUCS) framework with SPSS and 70 respondents to evaluate user satisfaction.',
              'Skills that map to real work.': 'Skills grounded in real work.',
              'I organize my skills around work I have actually performed, rather than listing technologies I have only encountered.': 'My skills focus on areas where I have direct hands-on experience.'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace('<h3>Technical Documentation &amp; UAT</h3><p>FRD / CR, user guides, ticketing workflows, defect tracking, acceptance criteria, Kanban, and Scrum fundamentals.</p><div class="skill-tags"><span>FRD / CR</span><span>UAT</span><span>Kanban</span><span>Scrum</span></div>', '<h3>UAT &amp; Technical Documentation</h3><p>FRD / CR, user guides, ticketing workflows, defect tracking, and acceptance criteria.</p><div class="skill-tags"><span>FRD / CR</span><span>UAT</span><span>Defect Tracking</span></div>')

          s = s.replace('<h3>Networking &amp; OS Basics</h3><p>Wi-Fi and router troubleshooting, basic operating systems, RJ45 crimping, SPSS, and Microsoft Office.</p><div class="skill-tags"><span>Wi-Fi</span><span>Router</span><span>RJ45</span><span>OS</span><span>SPSS</span><span>MS Office</span></div>', '<h3>Networking &amp; OS Basics</h3><p>Wi-Fi and router troubleshooting, basic operating systems, and RJ45 crimping.</p><div class="skill-tags"><span>Wi-Fi</span><span>Router</span><span>RJ45</span><span>OS</span></div>\n          <div class="skill-card"><span class="skill-no">05</span><h3>Tools &amp; Productivity</h3><p>Microsoft Office, Kanban, Scrum fundamentals, and SPSS for quantitative analysis.</p><div class="skill-tags"><span>MS Office</span><span>Kanban</span><span>Scrum</span><span>SPSS</span></div></div>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit static sync and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/sync-static-copy.yml
          git config user.name 'DaudRY'
          git config user.email '311488221+DaudRY@users.noreply.github.com'
          git add index.html .github/workflows/sync-static-copy.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sync static portfolio copy and graduation status'
          git push