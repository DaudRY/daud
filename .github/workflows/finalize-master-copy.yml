name: Finalize master portfolio copy v1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-copy:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize master portfolio copy v1.0') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply master copy to static HTML and case-study script
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          script = Path('script.js')
          html = index.read_text(encoding='utf-8')
          js = script.read_text(encoding='utf-8')

          replacements_html = {
            '<h2 id="about-title">Technical thinking with an operational mindset.</h2>': '<h2 id="about-title">Practical IT support with ERP implementation experience.</h2>',
            '<p>I am an Information Systems graduate from Universitas Mulawarman with a 3.80/4.00 GPA. My professional experience includes remote end-user support and ERP implementation, covering system installation, user access setup, module configuration, UAT, and issue tracking and documentation.</p>': '<p>I am an Information Systems graduate from Universitas Mulawarman with a 3.80/4.00 GPA. My hands-on experience includes ERP implementation, remote end-user support, UAT, troubleshooting, and technical documentation.</p>',
            '<p>I work effectively at the intersection of user needs and technical requirements, breaking down problems, documenting gaps, escalating defects, and helping ensure solutions work for end users.</p>': '<p>I am seeking an entry-level IT role where I can support users, understand business processes, troubleshoot issues, and continue developing my technical skills.</p>',
            '<p>Key figures grounded in my education, hands-on ERP experience, research, and leadership roles.</p>': '<p>Selected figures from my education and hands-on experience.</p>',
            '<h2 id="projects-title">Evidence over adjectives.</h2>': '<h2 id="projects-title">Selected work and academic projects.</h2>',
            '<p>Selected case studies based on documented experience. Sensitive client data, credentials, internal ticket IDs, transaction details, and proprietary configuration are intentionally excluded.</p>': '<p>Selected case studies based on documented experience. Client-specific information and internal materials are omitted.</p>',
            '<p>Supported nine client rollouts across Sales, Purchase, Inventory, POS, and Accounting, including remote access setup, configuration, troubleshooting, UAT, and handover documentation.</p>': '<p>Supported nine client rollouts across Sales, Purchase, Inventory, POS, and Accounting, including remote support, configuration, troubleshooting, UAT, and handover documentation.</p>',
            '<h3>From UAT checklist to same-day defect escalation</h3>': '<h3>UAT &amp; defect tracking workflow</h3>',
            '<p>Built and executed UAT checklists, identified around 1–3 defects per module, and logged each issue through a ticketing workflow on the same day.</p>': '<p>Built and executed UAT checklists across ERP modules, identified and logged around 1–3 defects per module, and escalated issues through a ticketing workflow on the same day.</p>',
            '<p>Turned configuration gaps and change needs into structured documentation so developers and end users had a clearer handover path before go-live.</p>': '<p>Documented technical gaps and change requests using FRD / CR, helping developers address configuration gaps before go-live. Created user documentation to support handover.</p>',
            '<span class="project-index">04</span><span class="project-label">RESEARCH</span>': '<span class="project-index">04</span><span class="project-label">ACADEMIC RESEARCH</span>',
            '<p>Thesis research using the End User Computing Satisfaction (EUCS) framework with SPSS and 70 respondents to evaluate user satisfaction.</p>': '<p>Bachelor’s thesis research using the End User Computing Satisfaction (EUCS) framework with SPSS and 70 respondents to evaluate user satisfaction.</p>',
            '<h2 id="experience-title">Professional experience first. Leadership as a strength.</h2>': '<h2 id="experience-title">Technical experience first, supported by broader experience.</h2>',
            '<p>My technical experience comes first, supported by field and leadership experience that strengthened my coordination, accountability, and communication.</p>': '<p>My technical experience comes first, supported by field and leadership experience that strengthened my coordination, accountability, and communication.</p>',
            '<h2 id="skills-title">Skills grounded in real work.</h2>': '<h2 id="skills-title">Skills grounded in hands-on experience.</h2>',
            '<h3>Tools &amp; Methods</h3>': '<h3>Tools &amp; Productivity</h3>',
            '<p>Microsoft Office, Kanban, Scrum fundamentals, and SPSS for quantitative analysis.</p>': '<p>Microsoft Office, Kanban and Scrum fundamentals, and SPSS for quantitative analysis.</p>',
            '<h2 id="contact-title">Open to the next technical opportunity.</h2>': '<h2 id="contact-title">Open to my next IT opportunity.</h2>',
            '<p>Open to IT Support, IT Engineer, ERP / Business Systems, and Management Trainee opportunities.</p>': '<p>Open to IT Support, IT Engineer, ERP / Business Systems, and Management Trainee opportunities.</p>',
            '<strong>Jul 2019 – Sep 2026</strong>': '<strong>Jul 2019 – May 2026</strong>',
            '<span>Status</span><strong>Degree requirements completed</strong>': '<span>Status</span><strong>Graduated: 25 May 2026</strong>',
            '<small>All degree requirements completed; thesis defense passed. Formal conferral expected in September 2026.</small>': '<small>Degree requirements completed; graduation recorded on 25 May 2026.</small>',
            '<span class="section-kicker">CERTIFICATIONS</span>': '<span class="section-kicker">CERTIFICATIONS</span>',
            '<span>English proficiency</span><strong>Intermediate written communication; basic conversational proficiency.</strong>': '<span>English proficiency</span><strong>Intermediate written communication; basic conversational proficiency.</strong>'
          }

          for old, new in replacements_html.items():
              if old not in html:
                  raise SystemExit(f'Missing expected HTML text: {old[:100]}')
              html = html.replace(old, new, 1)

          old_stats = '''      <div class="container stats-grid">\n        <div class="stat reveal"><strong>3.80</strong><span>GPA / 4.00</span></div>\n        <div class="stat reveal"><strong>09</strong><span>ERP client rollouts</span></div>\n        <div class="stat reveal"><strong>05</strong><span>ERP modules configured</span></div>\n        <div class="stat reveal"><strong>55</strong><span>members led in BLM</span></div>\n        <div class="stat reveal"><strong>70</strong><span>thesis respondents</span></div>\n      </div>'''
          new_stats = '''      <div class="container stats-grid">\n        <div class="stat reveal"><strong>3.80</strong><span>GPA / 4.00</span></div>\n        <div class="stat reveal"><strong>09</strong><span>ERP client rollouts</span></div>\n        <div class="stat reveal"><strong>05</strong><span>ERP modules</span></div>\n        <div class="stat reveal"><strong>1–3</strong><span>defects identified per module</span></div>\n      </div>'''
          if old_stats not in html:
              raise SystemExit('Missing expected Career Highlights stats block')
          html = html.replace(old_stats, new_stats, 1)

          replacements_js = {
            "text('#highlights-title + p', 'Key figures grounded in my education, hands-on ERP experience, research, and leadership roles.');": "text('#highlights-title + p', 'Selected figures from my education and hands-on experience.');",
            "text('#projects-title', 'Evidence over adjectives.');": "text('#projects-title', 'Selected work and academic projects.');",
            "text('#projects-title + p', 'Public-safe case studies based on documented experience. Sensitive client data, credentials, internal ticket IDs, transaction details, and proprietary configuration are intentionally excluded.');": "text('#projects-title + p', 'Selected case studies based on documented experience. Client-specific information and internal materials are omitted.');",
            "text('#experience-title', 'Professional experience first. Leadership as a strength.');": "text('#experience-title', 'Technical experience first, supported by broader experience.');",
            "text('#why-title', 'Why I fit entry-level IT Support & ERP roles.');": "text('#why-title', 'Why I fit entry-level IT Support & ERP roles.');",
            "text('#contact-title', 'Open to my next IT opportunity.');": "text('#contact-title', 'Open to my next IT opportunity.');",
            "text('#education .edu-facts > div:nth-child(2) strong', 'Jul 2019 – May 2026');": "text('#education .edu-facts > div:nth-child(2) strong', 'Jul 2019 – May 2026');",
            "text('#education .edu-facts > div:nth-child(3) strong', 'Graduated: 25 May 2026');": "text('#education .edu-facts > div:nth-child(3) strong', 'Graduated: 25 May 2026');",
            "text('.thesis-box small', 'Degree completed; graduation recorded on 25 May 2026.');": "text('.thesis-box small', 'Degree requirements completed; graduation recorded on 25 May 2026.');",
            "text('.skill-card:nth-child(5) h3', 'Tools & Productivity');": "text('.skill-card:nth-child(5) h3', 'Tools & Productivity');"
          }
          for old, new in replacements_js.items():
              if old in js:
                  js = js.replace(old, new, 1)

          # Reduce repeated sanitization language inside case-study modals.
          js = js.replace("summary: 'A public-safe view of the workflow, responsibilities, and measurable scope of the work without exposing client data or internal documents.'", "summary: 'A concise view of the workflow, responsibilities, and measurable scope without exposing client information.'")
          js = js.replace("summary: 'A sanitized workflow example that demonstrates how a test issue can be recorded and followed through without using internal project data.'", "summary: 'A representative UAT workflow showing how a test issue is recorded, escalated, and retested.'")
          js = js.replace("['Public-safe boundary', 'Internal filenames, transaction data, credentials, client-system screenshots, proprietary configuration, and other sensitive information are intentionally excluded.']", "['Data boundary', 'Internal filenames, transaction data, credentials, client-system screenshots, and proprietary configuration are excluded.']")
          js = js.replace("['Public-safe evidence', 'Around 1–3 defects per module were identified and escalated on the same day.']", "['Evidence', 'Around 1–3 defects per module were identified and escalated on the same day.']")
          js = js.replace("['Boundary', 'Client names, issue screenshots, user accounts, server details, release branches, and internal ticket IDs are omitted.']", "['Data boundary', 'Client names, issue screenshots, user accounts, server details, release branches, and internal ticket IDs are omitted.']")
          js = js.replace("['Public-safe evidence', '<div class=\"evidence-table\"><div><span>Input</span><strong>Configuration gap / change need</strong></div>", "['Evidence', '<div class=\"evidence-table\"><div><span>Input</span><strong>Configuration gap / change need</strong></div>")
          js = js.replace("kicker: 'CASE STUDY · RESEARCH'", "kicker: 'ACADEMIC PROJECT · RESEARCH'")

          index.write_text(html, encoding='utf-8')
          script.write_text(js, encoding='utf-8')
          PY

      - name: Commit finalized copy and remove temporary workflow
        run: |
          git config user.name "DaudRY"
          git config user.email "311488221+DaudRY@users.noreply.github.com"
          rm -f .github/workflows/finalize-master-copy.yml
          git add index.html script.js .github/workflows/finalize-master-copy.yml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Finalize master portfolio copy v1.0"
          git push
