name: Fix study period to May 2026

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-copy:
    if: ${{ !contains(github.event.head_commit.message, 'Fix study period to May 2026') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update study period only
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('master-copy.js')]
          old = 'Jul 2019 – Sep 2026'
          new = 'Jul 2019 – May 2026'
          changed = False
          for path in files:
              text = path.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  changed = True
                  path.write_text(updated, encoding='utf-8')
                  print(f'Updated {path}')
          if not changed:
              raise SystemExit('Expected study period text was not found.')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "DaudRY"
          git config user.email "311488221+DaudRY@users.noreply.github.com"
          rm -f .github/workflows/fix-study-period.yml
          git add index.html master-copy.js .github/workflows/fix-study-period.yml
          git commit -m "Fix study period to May 2026"
          git push
