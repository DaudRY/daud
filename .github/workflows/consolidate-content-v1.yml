name: Consolidate portfolio content

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ !contains(github.event.head_commit.message, 'Consolidate portfolio content') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove runtime copy overrides and simplify case study wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script = Path('script.js')
          text = script.read_text(encoding='utf-8')

          # HTML is the single source of portfolio copy. Keep JS for interactions only.
          text, removed = re.subn(
              r'function applyCopyPolish\(\) \{.*?\n\}\n\n',
              '',
              text,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f'Expected exactly one applyCopyPolish function, removed {removed}.')

          text = text.replace('\napplyCopyPolish();', '')
          text = text.replace("text('#education .edu-facts > div:nth-child(3) strong', 'Graduated: 25 May 2026');", '')
          text = text.replace("text('.thesis-box small', 'Degree completed; graduation recorded on 25 May 2026.');", '')

          # Reduce repeated sanitization language inside interactive case studies.
          replacements = {
              "A public-safe view of the workflow, responsibilities, and measurable scope of the work without exposing client data or internal documents.":
                  "A concise view of the workflow, responsibilities, and measurable scope of the work.",
              "A sanitized workflow example that demonstrates how a test issue can be recorded and followed through without using internal project data.":
                  "A representative workflow example showing how a test issue can be recorded and followed through.",
              "A representative documentation structure that demonstrates how requirements and changes can be made traceable without copying company documents.":
                  "A representative documentation structure showing how requirements and changes can be made traceable.",
              "A thesis summary focused on the research method, sample, and analytical workflow rather than personal respondent data.":
                  "A thesis summary focused on the research method, sample, and analytical workflow.",
              "['Sanitized evidence',": "['Evidence',",
              "['Public-safe boundary',": "['Scope note',",
              "['Sanitized defect example',": "['Representative defect example',",
              "['Public-safe evidence',": "['Evidence',",
              "Internal filenames, transaction data, credentials, client-system screenshots, proprietary configuration, and other sensitive information are intentionally excluded.":
                  "Client-specific records and internal materials are not reproduced.",
              "Client names, issue screenshots, user accounts, server details, release branches, and internal ticket IDs are omitted.":
                  "Client-specific details and internal ticket IDs are omitted.",
              "Sensitive client information and internal records are not reproduced. Project visuals are sanitized reconstructions intended to communicate scope, workflow, and outcomes.":
                  "Sensitive client information and internal records are not reproduced; project visuals communicate scope, workflow, and outcomes without client-specific details.",
              "Personal respondent data and institution-specific sensitive information are intentionally excluded.":
                  "Personal respondent data and sensitive institution-specific information are not reproduced.",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          script.write_text(text.strip() + '\n', encoding='utf-8')
          if 'applyCopyPolish' in text or '25 May 2026' in text:
              raise SystemExit('Legacy runtime copy remained in script.js.')

          master = Path('master-copy.js')
          if master.exists():
              master.unlink()
          else:
              raise SystemExit('master-copy.js was expected but not found.')
          PY

      - name: Validate source-of-truth cleanup
        shell: bash
        run: |
          if grep -RniE 'applyCopyPolish|master-copy|25 May 2026' --exclude-dir=.git .; then
            echo 'Legacy copy source or conflicting graduation date remains.'
            exit 1
          fi
          test -f index.html
          test -f script.js

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "DaudRY"
          git config user.email "311488221+github-noreply@users.noreply.github.com"
          rm -f .github/workflows/consolidate-content-v1.yml
          git add index.html script.js master-copy.js .github/workflows/consolidate-content-v1.yml
          git commit -m "Consolidate portfolio content into HTML source"
          git push
