l(#navy)"/><text x="767" y="83" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">02</text><text x="818" y="68" class="title">UAT Test Case · Inventory Module</text><text x="818" y="96" class="sub">Illustrative test case rebuilt from the structure and scope of the provided UAT documentation.</text><rect x="736" y="124" width="656" height="74" rx="12" fill="#f7fbff" stroke="#dce8f5"/><text x="756" y="151" class="label">MODULE</text><text x="756" y="178" class="strong">Inventory</text><text x="960" y="151" class="label">SCENARIO</text><text x="960" y="178" class="strong">Internal Transfer</text><text x="1192" y="151" class="label">OBJECTIVE</text><text x="1192" y="174" class="small">Validate stock movement</text><text x="1192" y="190" class="small">between locations</text><rect x="736" y="216" width="656" height="178" rx="12" class="panel"/><text x="756" y="244" class="strong">Sanitized Test Case</text><line x1="756" y1="258" x2="1372" y2="258" class="line"/><text x="760" y="278" class="label">STEP</text><text x="910" y="278" class="label">TEST ACTION</text><text x="1130" y="278" class="label">EXPECTED RESULT</text><text x="1330" y="278" class="label">STATUS</text><line x1="756" y1="289" x2="1372" y2="289" class="line"/><text x="760" y="312" class="body">01</text><text x="910" y="312" class="body">Select source location</text><text x="1130" y="312" class="body">Source selected</text><rect x="1322" y="295" width="50" height="24" rx="12" fill="#dff7ed"/><text x="1347" y="312" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#0d8c5d">PASS</text><text x="760" y="342" class="body">02</text><text x="910" y="342" class="body">Select destination</text><text x="1130" y="342" class="body">Destination selected</text><rect x="1322" y="325" width="50" height="24" rx="12" fill="#dff7ed"/><text x="1347" y="342" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#0d8c5d">PASS</text><text x="760" y="372" class="body">03</text><text x="910" y="372" class="body">Select product &amp; quantity</text><text x="1130" y="372" class="body">Validated successfully</text><rect x="1322" y="355" width="50" height="24" rx="12" fill="#dff7ed"/><text x="1347" y="372" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#0d8c5d">PASS</text><text x="736" y="420" class="small">Illustrative data only · based on documented UAT structure · no production data shown</text><g filter="url(#shadow)"><rect x="28" y="478" width="664" height="430" rx="20" class="panel"/></g><rect x="48" y="498" width="62" height="62" rx="14" fill="url(#navy)"/><text x="79" y="537" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">03</text><text x="130" y="522" class="title">FRD / Change Request</text><text x="130" y="550" class="sub">Reconstructed examples showing how requirements and configuration gaps can be documented safely.</text><rect x="48" y="578" width="298" height="238" rx="14" fill="#f7fbff" stroke="#dce8f5"/><text x="66" y="607" class="strong">Feature Request · Example</text><line x1="66" y1="619" x2="328" y2="619" class="line"/><text x="66" y="646" class="label">MODULE</text><text x="148" y="646" class="body">Purchase</text><text x="66" y="677" class="label">REQUEST</text><text x="148" y="677" class="body">Add Price After Discount</text><text x="66" y="709" class="label">BUSINESS NEED</text><text x="148" y="704" class="body">Display final price</text><text x="148" y="721" class="body">after discount.</text><text x="66" y="753" class="label">VALIDATION</text><text x="148" y="748" class="body">Field appears in PO</text><text x="148" y="765" class="body">and reporting.</text><rect x="148" y="782" width="104" height="24" rx="12" fill="#e7f1ff"/><text x="200" y="798" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#276fd3">UAT REQUIRED</text><rect x="366" y="578" width="304" height="238" rx="14" f