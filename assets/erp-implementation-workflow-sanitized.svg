<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b284b"/><stop offset="1" stop-color="#173c68"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7fa3c9" flood-opacity=".18"/></filter><style>.title{font:700 34px Arial,sans-serif;fill:#0d294c}.sub{font:400 18px Arial,sans-serif;fill:#54709a}.label{font:700 14px Arial,sans-serif;fill:#466487;letter-spacing:1px}.body{font:400 15px Arial,sans-serif;fill:#486889}.small{font:400 13px Arial,sans-serif;fill:#6c83a1}.strong{font:700 18px Arial,sans-serif;fill:#102f55}.metric{font:700 34px Arial,sans-serif;fill:#0c2d53}.panel{fill:#fff;stroke:#d7e4f3;stroke-width:2}.line{stroke:#d9e5f2;stroke-width:2}.step{fill:#f4f9ff;stroke:#d9e7f6;stroke-width:2}</style></defs><rect width="1440" height="960" fill="url(#bg)"/><g filter="url(#shadow)"><rect x="28" y="24" width="664" height="430" rx="20" class="panel"/></g><rect x="48" y="44" width="62" height="62" rx="14" fill="url(#navy)"/><text x="79" y="83" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">01</text><text x="130" y="68" class="title">ERP Implementation &amp; Multi-client Rollout</text><text x="130" y="96" class="sub">A public-safe reconstruction of the implementation workflow and responsibilities.</text><text x="130" y="119" class="sub">No client names, proprietary UI, credentials, transactions, or internal identifiers.</text><rect x="48" y="146" width="188" height="96" rx="16" fill="#f7fbff" stroke="#dce8f5"/><text x="68" y="174" class="metric">09</text><text x="68" y="202" class="strong">Client Rollouts</text><text x="68" y="224" class="small">Supported</text><rect x="254