 x="188" y="19" text-anchor="middle" class="strong">Submit for</text><text x="188" y="34" text-anchor="middle" class="strong">Approval</text><line x1="244" y1="21" x2="284" y2="21" stroke="#8eabd0" stroke-width="3"/><polygon points="284,21 275,15 275,27" fill="#8eabd0"/><rect x="284" width="92" height="42" rx="10" fill="#fff2d7" stroke="#f0dba9"/><text x="330" y="26" text-anchor="middle" class="strong">Waiting</text><line x1="376" y1="21" x2="416" y2="21" stroke="#8eabd0" stroke-width="3"/><polygon points="416,21 407,15 407,27" fill="#8eabd0"/><rect x="416" width="96" height="42" rx="10" fill="#e0f8ef" stroke="#c6eadc"/><text x="464" y="26" text-anchor="middle" class="strong">Confirmed</text><line x1="330" y1="42" x2="330" y2="92" stroke="#d59292" stroke-width="3"/><polygon points="330,92 324,83 336,83" fill="#d59292"/><rect x="284" y="92" width="92" height="42" rx="10" fill="#ffe8e8" stroke="#f1c4c4"/><text x="330" y="118" text-anchor="middle" class="strong">Cancelled</text></g><text x="756" y="800" class="small">States represented: draft · waiting · confirmed · cancelled</text><rect x="1188" y="580" width="204" height="240" rx="14" fill="#0e2d52"/><text x="1208" y="612" font-family="Arial" font-size="15" font-weight="700" fill="#fff">Key Data Handled</text><text x="1208" y="648" class="small" fill="#d7e6f8">Requester</text><text x="1208" y="668" font-family="Arial" font-size="13" fill="#fff">User / Requester</text><text x="1208" y="704" class="small" fill="#d7e6f8">Budget</text><text x="1208" y="724" font-family="Arial" font-size="13" fill="#fff">Parent Budget</text><text x="1208" y="760" class="small" fill="#d7e6f8">Planned Amount</text><text x="1208" y="780" font-family="Arial" font-size="13" fill="#fff">Current → New</text><rect x="736" y="842" width="656" height="44" rx="12" fill="#e9f4ff"/><text x="756" y="869" class="small">Sanitized portfolio mockup — reconstructed from documented workflow, not a product screenshot.</text></svg>