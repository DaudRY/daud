<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EEF5FB"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6C88A8" flood-opacity="0.14"/></filter><style>.title{font:700 31px Arial,sans-serif;fill:#0A2344}.sub{font:400 15px Arial,sans-serif;fill:#5D7390}.label{font:700 10px Arial,sans-serif;fill:#4E6C8E;letter-spacing:1.4px}.strong{font:700 17px Arial,sans-serif;fill:#102E54}.body{font:400 13px Arial,sans-serif;fill:#4B6480}.small{font:400 11px Arial,sans-serif;fill:#7187A1}.panel{fill:#FFF;stroke:#D8E4F0;stroke-width:2}.soft{fill:#F6FAFE;stroke:#DCE8F4;stroke-width:1.5}.blue{fill:#E7F1FF;stroke:#C9DAEF;stroke-width:1.5}</style></defs>
<rect width="1000" height="560" rx="28" fill="url(#bg)"/><rect x="24" y="24" width="58" height="58" rx="15" fill="#0B284B"/><text x="53" y="61" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">03</text><text x="102" y="53" class="title">FRD / Change Request</text><text x="102" y="79" class="sub">Examples of requirement and configuration-change documentation derived from project materials.</text>
<rect x="30" y="118" width="450" height="350" rx="18" class="panel" filter="url(#shadow)"/><text x="52" y="147" class="label">FEATURE REQUEST · PURCHASE</text><text x="52" y="176" class="strong">Add “Price After Discount”</text><g transform="translate(52,201)"><text x="0" y="0" class="label">BUSINESS NEED</text><text x="0" y="22" class="body">Display the final price after discount.</text><text x="0" y="61" class="label">CURRENT GAP</text><text x="0" y="83" class="body">Price-after-discount value is not visible.</text><text x="0" y="122" class="label">PROPOSED CHANGE</text><text x="0" y="144" class="body">Add the field to the purchase workflow</text><text x="0" y="162" class="body">and related reporting.</text><text x="0" y="201" class="label">VALIDATION</text><text x="0" y="223" class="body">UAT required before release.</text></g>
<rect x="520" y="118" width="450" height="350" rx="18" class="panel" filter="url(#shadow)"/><text x="542" y="147" class="label">CHANGE REQUEST · POS</text><text x="542" y="176" class="strong">Group Card configuration</text><g transform="translate(542,201)"><text x="0" y="0" class="label">REQUEST</text><text x="0" y="22" class="body">Create, update, and manage merchant / bank groups.</text><text x="0" y="61" class="label">SCOPE</text><text x="0" y="83" class="body">Activate for POS usage and organize card-payment types.</text><text x="0" y="122" class="label">RELATED DATA</text><text x="0" y="144" class="body">Group Card · Card Payment · payment configuration.</text><text x="0" y="183" class="label">VALIDATION</text><text x="0" y="205" class="body">Test configuration and confirm expected POS behavior.</text></g>
<rect x="30" y="492" width="940" height="38" rx="12" class="blue"/><text x="500" y="516" text-anchor="middle" class="body">Sanitized examples reconstructed from supplied FRD / UAT material. No client records or proprietary documents reproduced.</text></svg>