<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Sanitized ERP implementation evidence</title><desc id="desc">A reconstructed, public-safe visualization of ERP implementation work covering client rollouts, core modules, UAT, defect tracking, documentation, and budget approval workflow.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#f9fbff"/></linearGradient><linearGradient id="nav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2342"/><stop offset="1" stop-color="#07101d"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14345b" flood-opacity=".10"/></filter><style>.t{font-family:Inter,Arial,sans-serif;fill:#10284b}.muted{font-family:Inter,Arial,sans-serif;fill:#61779a}.small{font-size:16px}.label{font-size:18px;font-weight:700}.head{font-size:30px;font-weight:800}.body{font-size:19px}.tiny{font-size:14px}.num{font-size:34px;font-weight:800}</style></defs><rect width="1536" height="1024" fill="url(#bg)"/><rect x="0" y="0" width="48" height="1024" fill="#d9e7f7"/><rect x="48" y="0" width="244" height="1024" rx="0" fill="url(#nav)"/><g transform="translate(80 55)"><rect width="42" height="42" rx="10" fill="#fff" opacity=".95"/><path d="M12 21h18M12 28h18M12 14h12" stroke="#245da6" stroke-width="4" stroke-linecap="round"/><text x="58" y="21" class="t" fill="#fff" font-size="21" font-weight="800">ERP Implementation</text><text x="58" y="45" fill="#b8c8dc" font-size="15" font-family="Inter,Arial,sans-serif">Sanitized portfolio evidence</text></g><g transform="translate(78 150)" fill="#d9e6f7" font-family="Inter,Arial,sans-serif" font-size="17"><text y="0">IMPLEMENTATION</text><text y="54">Overview</text><text y="102">Sales</text><text y="150">Purchase</text><text y="198">Inventory</text><text y="246">POS</text><text y="294">Accounting</text><text y="360">UAT &amp; QA</text><text y="408">Documentation</text><text y="456">Access Rights</text></g><g transform="translate(338 46)"><rect width="1148" height="74" rx="18" fill="#fff" filter="url(#shadow)"/><circle cx="34" cy="37" r="14" fill="#e4eefc"/><path d="M29 37h10M34 32v10" stroke="#3477c6" stroke-width="2.8"/><text x="62" y="33" class="muted body">Search modules, workflows, or documentation...</text><circle cx="1062" cy="37" r="21" fill="#e9f2ff"/><text x="1055" y="44" class="t label">DR</text></g><g transform="translate(338 148)"><rect width="1148" height="242" rx="24" fill="#fff" filter="url(#shadow)"/><text x="34" y="46" class="muted small" font-weight="800" letter-spacing="2">ERP IMPLEMENTATION WORKSPACE</text><text x="34" y="88" class="t" font-size="38" font-weight="800">Supporting multi-client ERP rollouts</text><text x="34" y="126" class="muted body">Configuration, UAT, troubleshooting, defect escalation,</text><text x="34" y="154" class="muted body">FRD / Change Request, and user handover documentation.</text><rect x="34" y="180" width="220" height="38" rx="19" fill="#edf5ff"/><text x="51" y="205" fill="#1e63b4" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">SANITIZED MOCKUP</text><rect x="794" y="34" width="315" height="174" rx="18" fill="#f4f8fd" stroke="#d7e4f4"/><rect x="820" y="58" width="112" height="68" rx="12" fill="#eaf3ff"/><text x="834" y="84" class="muted tiny">09</text><text x="834" y="108" class="t label">rollouts</text><rect x="948" y="58" width="134" height="68" rx="12" fill="#eaf9f4"/><text x="963" y="84" class="muted tiny">05</text><text x="963" y="108" class="t label">modules</text><path d="M825 172h255" stroke="#c6d7eb" stroke-width="2"/><path d="M846 158l36-18 30 10 40-34 32 19 41-30" fill="none" stroke="#2b72d1" stroke-width="4"/><circle cx="846" cy="158" r="4" fill="#2b72d1"/><circle cx="882" cy="140" r="4" fill="#2b72d1"/><circle cx="912" cy="150" r="4" fill="#2b72d1"/><circle cx="952" cy="116" r="4" fill="#2b72d1"/><circle cx="984" cy="135" r="4" fill="#2b72d1"/><circle cx="1025" cy="105" r="4" fill="#2b72d1"/></g><g transform="translate(338 414)"><rect width="1148" height="244" rx="24" fill="#fff" filter="url(#shadow)"/><text x="34" y="43" class="t head">Implementation Workflow</text><text x="34" y="71" class="muted small">A public-safe reconstruction of the documented delivery process.</text><g transform="translate(34 100)"><rect width="202" height="112" rx="18" fill="#eef5ff"/><circle cx="34" cy="35" r="22" fill="#2c73d2"/><text x="28" y="41" fill="#fff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="800">01</text><text x="72" y="42" class="t label">Configuration</text><text x="20" y="70" class="muted tiny">System setup &amp;</text><text x="20" y="90" class="muted tiny">module configuration</text><path d="M202 56h32" stroke="#7fa6d5" stroke-width="3"/><path d="M225 49l9 7-9 7" fill="none" stroke="#7fa6d5" stroke-width="3"/></g><g transform="translate(278 100)"><rect width="202" height="112" rx="18" fill="#eefbf7"/><circle cx="34" cy="35" r="22" fill="#17a784"/><text x="28" y="41" fill="#fff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="800">02</text><text x="72" y="42" class="t label">UAT</text><text x="20" y="70" class="muted tiny">Test planning &amp;</text><text x="20" y="90" class="muted tiny">validation</text><path d="M202 56h32" stroke="#7fa6d5" stroke-width="3"/><path d="M225 49l9 7-9 7" fill="none" stroke="#7fa6d5" stroke-width="3"/></g><g transform="translate(522 100)"><rect width="202" height="112" rx="18" fill="#fff7ee"/><circle cx="34" cy="35" r="22" fill="#ed8e2f"/><text x="28" y="41" fill="#fff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="800">03</text><text x="72" y="42" class="t label">Defect Tracking</text><text x="20" y="70" class="muted tiny">Log, analyze &amp;</text><text x="20" y="90" class="muted tiny">escalate issues</text><path d="M202 56h32" stroke="#7fa6d5" stroke-width="3"/><path d="M225 49l9 7-9 7" fill="none" stroke="#7fa6d5" stroke-width="3"/></g><g transform="translate(766 100)"><rect width="202" height="112" rx="18" fill="#f3f0ff"/><circle cx="34" cy="35" r="22" fill="#7157d9"/><text x="28" y="41" fill="#fff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="800">04</text><text x="72" y="42" class="t label">Retest</text><text x="20" y="70" class="muted tiny">Verify fixes &amp;</text><text x="20" y="90" class="muted tiny">confirm resolution</text><path d="M202 56h32" stroke="#7fa6d5" stroke-width="3"/><path d="M225 49l9 7-9 7" fill="none" stroke="#7fa6d5" stroke-width="3"/></g><g transform="translate(1010 100)"><rect width="104" height="112" rx="18" fill="#eefbf7"/><circle cx="34" cy="35" r="22" fill="#18a986"/><text x="28" y="41" fill="#fff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="800">05</text><text x="14" y="75" class="t label" font-size="16">Handover</text><text x="14" y="96" class="muted tiny">Docs +</text></g></g><g transform="translate(338 682)"><rect width="1148" height="284" rx="24" fill="#fff" filter="url(#shadow)"/><text x="34" y="42" class="t head">Sanitized UAT Evidence</text><text x="34" y="70" class="muted small">Representative structure based on the Inventory UAT checklist; no client names, credentials, IDs, or internal records.</text><rect x="34" y="96" width="430" height="142" rx="16" fill="#f7faff" stroke="#d8e5f4"/><text x="54" y="126" class="t label">Internal Transfer — Test Case</text><text x="54" y="154" class="muted tiny">Module</text><text x="210" y="154" class="t small" font-weight="700">Inventory</text><text x="54" y="181" class="muted tiny">Objective</text><text x="210" y="181" class="t tiny">Validate stock movement</text><text x="54" y="208" class="muted tiny">Expected</text><text x="210" y="208" class="t tiny">Transfer completes successfully</text><rect x="492" y="96" width="622" height="142" rx="16" fill="#fbfdff" stroke="#d8e5f4"/><text x="514" y="126" class="t label">Test Flow</text><g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700"><rect x="514" y="150" width="112" height="42" rx="12" fill="#edf5ff"/><text x="540" y="176" class="t">Source</text><path d="M626 171h36" stroke="#7899bd" stroke-width="2"/><path d="M654 165l8 6-8 6" fill="none" stroke="#7899bd" stroke-width="2"/><rect x="668" y="150" width="112" height="42" rx="12" fill="#edf5ff"/><text x="693" y="176" class="t">Product</text><path d="M780 171h36" stroke="#7899bd" stroke-width="2"/><path d="M808 165l8 6-8 6" fill="none" stroke="#7899bd" stroke-width="2"/><rect x="822" y="150" width="112" height="42" rx="12" fill="#edf5ff"/><text x="851" y="176" class="t">Qty</text><path d="M934 171h36" stroke="#7899bd" stroke-width="2"/><path d="M962 165l8 6-8 6" fill="none" stroke="#7899bd" stroke-width="2"/><rect x="976" y="150" width="112" height="42" rx="12" fill="#e8fbf4"/><text x="1002" y="176" fill="#137a60">Confirmed</text></g><text x="514" y="216" class="muted tiny">Status examples are illustrative and do not represent confidential project records.</text><text x="34" y="265" class="muted tiny" font-style="italic">Sanitized portfolio mockup — reconstructed from documented workflow, not a product screenshot.</text></g></svg>